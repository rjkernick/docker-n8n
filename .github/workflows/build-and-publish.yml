name: Build and Publish n8n

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      latest_version: ${{ steps.set-matrix.outputs.latest_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            skip-versions.txt

      - name: Check for new versions
        id: set-matrix
        run: |
          MATRIX_JSON=$(./scripts/determine-versions.sh)

          echo "Build matrix: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.check-versions.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve base image
        id: base
        run: |
          BASE_IMAGE=$(./scripts/resolve-base-image.sh "${{ matrix.version }}")
          echo "Resolved base image: $BASE_IMAGE"
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build for testing (Local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          cache-from: type=gha,scope=n8n-build
          cache-to: type=gha,scope=n8n-build,mode=max
          build-args: |
            N8N_VERSION=${{ matrix.version }}
            N8N_BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: rjkernick/n8n:${{ matrix.version }}

      - name: Run Permission Tests
        run: |
          ./scripts/test-permissions.sh rjkernick/n8n:${{ matrix.version }} skip-build

      - name: Run Startup Smoke Test
        run: |
          ./scripts/test-startup.sh rjkernick/n8n:${{ matrix.version }} skip-build

      - name: Check if this version is the latest stable
        id: check_latest
        run: |
          if [ "${{ matrix.version }}" == "${{ needs.check-versions.outputs.latest_version }}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=n8n-build
          cache-to: type=gha,scope=n8n-build,mode=max
          build-args: |
            N8N_VERSION=${{ matrix.version }}
            N8N_BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            rjkernick/n8n:${{ matrix.version }}
            ${{ steps.check_latest.outputs.is_latest == 'true' && 'rjkernick/n8n:latest' || '' }}
          platforms: linux/amd64,linux/arm64

      - name: Notify Mattermost on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.MATTERMOST_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"### :x: n8n build failed\\n**Version:** \`${{ matrix.version }}\`\\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
